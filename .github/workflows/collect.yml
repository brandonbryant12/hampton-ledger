name: Collect public records for review
on:
  schedule:
    - cron: '23 11 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PDF text extraction
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: npm run ingest
      - run: npm run validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-update-for-review
          path: |
            public/data/records.json
            public/sources/
          retention-days: 30
